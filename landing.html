<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unassigned Card Finder</title>
    <!-- Trello Power-Up Client Library -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <link rel="stylesheet" href="./src/styles/app.css" />
  </head>
  <body>
    <div class="modal-container">
      <!-- Shared Header bar across all views -->
      <header class="app-header">
        <div class="header-brand">
          <span class="header-icon" id="headerIcon" aria-hidden="true"></span>
          <span class="header-title">Unassigned Card Finder</span>
        </div>
        <!-- Trello provides the modal close control in the top-right corner; no custom close button rendered here -->
      </header>

      <!-- View container swapped in place: landing -> scanning -> results -->
      <div id="viewContainer" class="view-container"></div>
    </div>

    <script type="module" src="./src/app/main.js"></script>
  </body>
</html>
